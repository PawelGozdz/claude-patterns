    # source: clean-arch
    - keywords: [tekst, string, tłumaczenie, arb, l10n, lokalizacja]
      include:
        - flutter/localization-pattern.md

analyze:
  panel:
    # source: flutter
    - {stage: threat-model, agent: "/threat-model", when: "auth|pii|cross_context|public_api", output: "docs/security/threat-models/TM-{TASK_ID}.md", skip_if_exists: true}
    # source: clean-arch
    - {stage: tech-analysis, agent: "flutter-architecture-expert"}
    # source: clean-arch
    - {stage: ux-design, agent: "flutter-ux-designer", when: "ekran|screen|widget|komponent|ui|ux|formularz|onboarding|przepływ|flow", advisory: true}
    # source: clean-arch
    - {stage: impl-analysis, agent: "flutter-quality-verifier", advisory: true}
    # source: clean-arch
    - {stage: ui-analysis, agent: "flutter-ui-verifier", advisory: true}
    # source: clean-arch
    - {stage: perf-analysis, agent: "flutter-performance-verifier", when: "lista|list|przewijan|scroll|mapa|map|animacj|wydajnoś|performance|jank|czat|chat", advisory: true}
  exit: PAUSE # source: clean-arch

orchestrate: # source: clean-arch
  layers:
    - {id: domain, dirs: [domain/], agent: "flutter-implementer"}
    - {id: application, dirs: [application/], agent: "flutter-implementer", optional: true, create_when: "decisions[].application_layer == true (kryterium ADR-A)"}
    - {id: data, dirs: [data/], agent: "flutter-implementer", tests: true}
    - {id: presentation, dirs: [presentation/], agent: "flutter-implementer", tests: true}
  inner_loop: {verify: "flutter-quality-verifier | flutter-ui-verifier", max_attempts: 3, on_max: ESCALATE_AND_HALT}
  # Bramka końcowa = bezpieczeństwo, analogicznie do ddd/core (security-e2e-verifier).
  # Jakość/wzorce są już wymuszone w inner_loop przy każdej warstwie; ostatni zamek
  # przed staged sprawdza to, czego nie widać w pojedynczej warstwie: sekrety, logi,
  # pinning, deep linki i realność kanałów natywnych.
  final_gate: {agent: "flutter-security-verifier", on_fail: ESCALATE_AND_HALT}
  exit: STAGE_NOT_COMMIT

hooks: [check-patterns-read, check-clean-arch, check-riverpod-patterns, check-flutter-imports, check-pumpandsettle, check-typography-tokens, check-design-tokens, check-l10n-hardcoded, check-focus-wrapper, check-approval-before-impl, check-human-voice]

