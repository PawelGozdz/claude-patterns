    - {stage: threat-model, agent: "/threat-model", when: "\\b(auth|authn|authz|authentication|authorization|login|sesj|session|token)\\b|\\bpii\\b|cross[-_ ]context|public[-_ ]api|publiczn\\w* endpoint", output: "docs/security/threat-models/TM-{TASK_ID}.md", skip_if_exists: true}
    # source: nestjs
    - {stage: tech-analysis, agent: "ecc:architect"}
    # source: nestjs
    - {stage: tech-analysis-specialist, agent: "backend-technology-expert"}
    # source: ddd/core
    - {stage: ddd-modeling, agent: "ddd-application-expert"}
    # source: ddd/core
    - {stage: impl-analysis, agent: "infrastructure-implementer", advisory: true}
    # source: ddd/core
    - {stage: pattern-fit, agent: "code-quality-verifier", advisory: true}
  exit: PAUSE # source: ddd/core

orchestrate: # source: ddd/layers
  # 2026-07-02: domain i application ROZDZIELONE — podwójna warstwa (15-25 plików)
  # strukturalnie nie mieściła się w budżecie tur implementera, a fail handlera oznaczał
  # re-implementację OBU warstw ×3. Application czyta świeży kod domeny z repo.
  # 2026-07-09: infrastructure ROZDZIELONE od testów — pisanie kodu produkcyjnego
  # i pisanie testów do cudzego kodu to dwa różne fachy; load-testy nie miały właściciela.
  layers:
    - {id: domain, dirs: [domain/], agent: "domain-application-implementer", tags: ["api:domain"], role: "Model domenowy: agregaty, encje, VO, zdarzenia i specyfikacje. Zero I/O, zero frameworka."}
    - {id: application, dirs: [application/], agent: "domain-application-implementer", tags: ["api:app"], role: "Przypadki użycia: handlery komend i zapytań orkiestrujące domenę. Bez reguł biznesowych — te należą do domeny."}
    - {
        id: infrastructure,
        dirs: [infrastructure/],
        agent: "infrastructure-implementer",
        tags: ["api:data-access", "api:api-surface"],
        role: "Styk ze światem: repozytoria, kontrolery, mappery, adaptery. Tłumaczy między domeną a technologią.",
        patterns: [infrastructure/repository-pattern.md] # +kysely
      }
    - {id: testing, dirs: [__tests__/], agent: "test-implementer", tests: true, tags: ["api:tests"], role: "Weryfikacja cudzego kodu: piramida L1/L2/L3. Testy dowodzą reguł, nie powtarzają implementacji."}
  inner_loop: {verify: "code-quality-verifier", max_attempts: 3, on_max: ESCALATE_AND_HALT}
  final_gate: {agent: "security-e2e-verifier", on_fail: ESCALATE_AND_HALT}
  exit: STAGE_NOT_COMMIT

hooks: [check-security-considerations, check-context-isolation, check-delegation, check-patterns-read, check-subagent-pattern-reads, check-approval-before-impl, check-ddd-patterns, check-domain-purity, check-human-voice]

