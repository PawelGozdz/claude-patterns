# GENERATED przez materialize-runtime.mjs (ADR 0008) — NIE edytuj ręcznie.
# Zmiany rób w blokach (claude-patterns/blocks/ lub .claude/blocks/) i odpal setup-project.sh.

schema_version: 1
stack_blocks: [node, kysely, zod, flat-service]
# osie: node=framework, kysely=persistence, zod=validation, flat-service=architecture

patterns:
  always:
    - cross-layer/conventions-pattern.md # source: node
    - cross-layer/security-invariants-pattern.md # source: node
    - cross-layer/safe-error-propagation-pattern.md # source: node
    - cross-layer/logger-pattern-plain.md # source: node
    - infrastructure/repository-pattern-plain.md # source: node
    - infrastructure/controller-schema-pattern-plain.md # source: node
  triggers:
    # source: node
    - keywords: [auth, authentication, authorization, permission, login]
      include:
        - cross-layer/security-invariants-pattern.md
    # source: node
    - keywords: [test, fixture, mock, coverage, e2e]
      include:
        - testing/testing-pyramid-pattern.md
    # source: kysely
    - keywords: [repository, migration, schema, transaction]
      include: []
    # source: zod
    - keywords: [validation, dto, input, request body, schema, endpoint]
      include:
        - infrastructure/zod-schema-validation-pattern.md
    # source: zod
    - keywords: [rate limit, rate-limit, throttl, limit żądań, brute force]
      include:
        - infrastructure/rate-limit-guard-pattern.md

analyze:
  panel:
    # source: node
    - {stage: threat-model, agent: "/threat-model", when: "auth|pii|cross_context|public_api", output: "docs/security/threat-models/TM-{TASK_ID}.md", skip_if_exists: true}
    # source: node
    - {stage: tech-analysis, agent: "ecc:architect"}
    # source: node
    - {stage: tech-analysis-specialist, agent: "backend-technology-expert"}

orchestrate: # source: flat-service
  layers:
    - {
        id: implementation,
        dirs: [src/],
        agent: "general-purpose",
        # Trzy tagi, bo ta warstwa NAPRAWDĘ zawiera wszystko: przypadki użycia, dostęp
      # do danych i endpointy leżą tu obok siebie. Wkłady z osi persystencji i walidacji
      # mają więc trafiać do niej — inaczej płaski serwis nie dostaje ich w ogóle.
        tags: ["any:app", "any:data-access", "any:api-surface"],
        role: "Cały kod produkcyjny serwisu — bez podziału na warstwy domenowe (to świadomy wybór tej osi)."
      }
    - {id: testing, dirs: [src/, test/], agent: "general-purpose", tests: true, tags: ["any:tests"], role: "Testy kolokowane z kodem: jednostkowe i integracyjne."}
  inner_loop: {verify: "ecc:typescript-reviewer", max_attempts: 3, on_max: ESCALATE_AND_HALT}
  final_gate: {agent: "ecc:security-reviewer", on_fail: ESCALATE_AND_HALT}
  exit: STAGE_NOT_COMMIT

hooks: [check-security-considerations, check-context-isolation, check-patterns-read, check-human-voice]

overlay:
  patterns: [infrastructure/]

human_voice: # język tekstu dla człowieka; nadpisz w project.yml → human_voice
  language: pl
  register: business
  max_sentences: 2
  avoid: [nazwy klas i funkcji, ścieżki plików, numery ADR/BDR, żargon warstw i wzorców]

taxonomy: # rdzeń blocks/_taxonomy.yml + .claude/taxonomy.yml projektu
  stacks:
    - any
    - api
    - mobile
    - web
    - lib
    - data
    - infra
  areas:
    - auth
    - authz
    - domain
    - app
    - data-access
    - events
    - geo
    - api-surface
    - ui
    - tests
    - security
    - observability
    - build
    - economy
    - platform
    - process
  variants_seen:
    app: [async, batching, concurrency, cross-context, errors, external-integration, ingestion, llm, model-lifecycle]
    api-surface: [barrel, contract, deprecation, errors, semver]
    data-access: [http, mapper, migration, offline, polyglot, projection, transaction]
    domain: [aggregate, errors, moderation-buffer]
    events: [domain, integration, outbox, queue]
    geo: [radius, teryt, polygon, discovery]
    observability: [audit, logging]
    platform: [channel, gpu, nestjs, nextjs, python, svelte]
    process: [review]
    security: [identity, rate-limit, validation]
    tests: [contract, e2e, fixtures, integration, load, seeding, unit]
    ui: [accessibility, design-token, forms, i18n, navigation, state]

requires_ecc: # source: node
  profile: developer
  modules: [lang:typescript, capability:orchestration]
