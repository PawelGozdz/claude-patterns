# Dedicated Qdrant for claude-patterns code retrieval — ISOLATED from any shared/prod Qdrant.
# Host port 6401 (not the shared 6333) → set KR_QDRANT_URL=http://localhost:6401.
# Persistent named volume so the index survives restarts; reseed only on pattern/code change.
#
# Network boundary: Qdrant's REST/gRPC ports are bound to 127.0.0.1 only — NOT reachable from
# other machines/services on the LAN. The only public-facing surface is the knowledge-retriever
# MCP daemon (:6403) — Qdrant sits BEHIND it. Loopback binding still allows host-side admin
# tooling (reseed.sh/reseed.mjs, manual curl diagnostics) to reach localhost:6401 directly.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cp-knowledge-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6401:6333"   # REST — localhost-only (admin/reseed access), not LAN-exposed
      - "127.0.0.1:6402:6334"   # gRPC — localhost-only
    volumes:
      - ./volumes/qdrant:/qdrant/storage   # bind-mount IN the repo (portable, visible)

  knowledge-retriever:
    build: .
    container_name: cp-knowledge-retriever
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "6403:6403"   # MCP HTTP (POST /mcp) — shared daemon, all projects point .mcp.json here
    volumes:
      # Host-path mirror (ro) — required for POST /reindex-file (knowledge-freshness-postwrite.js
      # hook): the container must read the same absolute path the host-side hook sends it, e.g.
      # /opt/projects/juz-ide-api-1/src/x.ts. Without this the endpoint 500s with ENOENT for every
      # project. Full reseed (reseed.sh/reseed.mjs) is unaffected — that runs on the host, not here.
      - /opt/projects:/opt/projects:ro
    environment:
      KR_TRANSPORT: http
      KR_HTTP_PORT: "6403"
      KR_QDRANT_URL: http://qdrant:6333   # internal docker network — service name, internal port (not host 6401)
      KR_EMBED_PROVIDER: ${KR_EMBED_PROVIDER:-ct301}
      KR_EMBED_URL: ${KR_EMBED_URL:-http://192.168.0.150:8301/v1/embeddings/generate}
      KR_EMBED_MODEL: ${KR_EMBED_MODEL:-multilingual-e5-large}
