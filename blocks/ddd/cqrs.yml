# Blok: ddd/cqrs — command/query handlery, sagi.
name: ddd/cqrs
# Oś architektury, ale NIE wnosi własnych warstw do orchestrate.layers —
# warstwy wnosi wyłącznie ddd/core. axis: architecture tu nie oznacza
# obowiązku deklarowania layers.
axis: architecture
requires: [ddd/core]

patterns:
  triggers:
    - keywords: [handler, command, query, saga, cqrs]
      include:
        - application/command-handler-pattern.md
        - application/query-handler-pattern.md
    # K86 (TASK-KAIZEN-002): obie karty istniały, ale nie występowały w `always`,
    # `triggers` ani `pattern_routing` ŻADNEGO bloku — czyli nie miały jak trafić do
    # prompta implementera przez mechanizm wymuszony, tylko przez podobieństwo
    # embeddingów w `retrieve_patterns`, jeśli ktoś akurat zapytał.
    #
    # TCC nie dostaje `pattern_routing`: protokół reserve→confirm/release nie ma
    # własnego rodzaju pliku. Mieszka w handlerze (`/application/commands/`, już
    # zarutowane na command-handler) albo w serwisie (`/application/services/`, już
    # zarutowane na application-service). Druga reguła na te same ścieżki tylko
    # przesłoniłaby wzorzec, który rządzi tam bez konkurencji.
    - keywords: [rezerwacj, reservation, reserve, confirm, release, kompensacj, compensate, rollback, tcc]
      include:
        - application/try-confirm-cancel-pattern.md
    # Mapper DTO odpowiedzi (DM1-DM5) leży obok `handler.ts` tej samej komendy, a nie
    # w `/infrastructure/repositories/mappers/` — nazwa pliku `*.mapper.ts` jest już
    # zajęta przez mapper persystencji (blok `kysely`), więc rozróżnia je kontekst
    # zadania, nie ścieżka. Stąd wyzwalacz słowny, nie routing.
    - keywords: [dto, response, odpowiedź, mapper, mapowanie, result.ok]
      include:
        - cross-layer/dto-mapper-pattern.md
    # Kolejka w handlerze komendy idzie przez port (QP1). Wyzwalacz słowny obejmuje też warstwy, które
    # DOSTARCZAJĄ adapter portu (infrastructure) — tam implementer inaczej nie zobaczyłby, po co jest Symbol.
    - keywords: [queue, kolejk, bullmq, enqueue, outbox, sms, "e-mail wysyłk"]
      include:
        - application/command-handler-queue-port-pattern.md

# ORC-118 (TS-SEC-D0-BETA-HARDENING-001): implementer i weryfikator warstwy application mają karty handlera
# komend i portu kolejki ZAWSZE, nie tylko gdy opis taska zawiera słowo „handler"/„queue". Dotąd karta
# command-handler wchodziła wyłącznie z wyzwalacza słownego i z `pattern_routing` (hooki), a karty portu kolejki nie
# było w żadnym kanale — implementer dostał `@InjectQueue` do handlera, bo żadna karta tego nie zakazywała.
layer_contributions:
  - match: "*:app"
    patterns:
      - application/command-handler-pattern.md
      - application/command-handler-queue-port-pattern.md

overlay:
  patterns: [application/]

# Routing plik → wzorzec (patrz ddd/core.yml po uzasadnienie miejsca).
pattern_routing:
  paths:
    - { match: "/application/commands/", pattern: application/command-handler-pattern.md }
    - { match: "/application/queries/", pattern: application/query-handler-pattern.md }
    - { match: "/application/event-handlers/", pattern: application/audit-handler-pattern.md }
    - { match: "/application/services/", pattern: application/application-service-pattern.md }
  filenames:
    # Goły `.handler.ts` poza `/application/**` to najczęściej handler komendy.
    - { match: "\\.handler\\.ts$", pattern: application/command-handler-pattern.md }
