# Blok: ddd/core — rdzeń DDD: modelowanie domeny, agenci DDD + VETO verifiers,
# twarda bramka approval (analyze PAUSE). Warstwy implementacji wnosi `ddd/layers`.
# Specyfikacje i polityki należą tutaj (OQ1). Wymagany przez wszystkie ddd/*.
# SPRZĘŻENIE Z BIBLIOTEKĄ (stan faktyczny, zmierzony 2026-08-11): wzorce tego bloku
# mają 68 odwołań do `@vytches/ddd` (+ ddd-messaging, repositories, domain-services,
# contracts), a implementerzy zakładają jej klasy bazowe (AggregateRoot, ValueObject,
# Result<T>). To NIE jest generyczny blok „DDD w ogóle" — opisuje pracę z tą biblioteką.
#
# Dlaczego nie rozdzielamy pojęć od biblioteki: rozbicie oznaczałoby przepisanie 68
# miejsc pod hipotezę użycia innego frameworka DDD, a biblioteka jest nasza i jej wybór
# jest strategiczny. Reguła „uniwersalne dopiero po drugim użyciu" działa też tutaj.
#
# Konsekwencja praktyczna: projekt biorący ten blok POWINIEN mieć `@vytches/ddd`
# w zależnościach. Nazwa i minimalna wersja poniżej trafiają do runtime.yml i do
# promptów implementerów — dzięki temu agent wie, o której bazie mówią wzorce.
name: ddd/core
axis: architecture
requires: []

params:
  ddd_library:
    type: string
    required: false
    default: "@vytches/ddd"
    doc: "biblioteka bazowa modelu domenowego, do której odnoszą się wzorce tego bloku"
  ddd_library_min_version:
    type: string
    required: false
    default: null
    doc: "minimalna wersja — ustaw, gdy wzorce zaczną zakładać API nowsze niż to, co ma projekt"

patterns:
  always:
    - cross-layer/domain-errors-pattern.md
  triggers:
    - keywords: [aggregate, entity, value object, domain event, specification, policy]
      include:
        - domain/aggregate-pattern.md
        - domain/value-object-pattern.md
    # K86 (TASK-KAIZEN-002): karta `named-policy` nie występowała w `always`,
    # `triggers` ani `pattern_routing` żadnego bloku — jedyną drogą do prompta było
    # podobieństwo embeddingów. Osobna grupa, nie dopisek do listy wyżej: NP1 włącza
    # się dopiero przy SKŁADANIU ≥2 specyfikacji w jedną bramkę, więc wyzwalają ją
    # inne słowa niż samo „specification" (to jest wzorzec o kompozycji, nie o
    # pisaniu pojedynczej specyfikacji).
    #
    # Bez `pattern_routing`: `/domain/specifications/` i `/domain/policies/` rządzi
    # `specification-policy-pattern.md` i to jest poprawne — polityka złożona nie ma
    # własnego katalogu ani sufiksu pliku, poznaje się ją po kształcie fabryki.
    - keywords: [polityk, policy, guardrail, bramka, gate, "business rule", "reguła biznesowa", uprawnien, kompozycj]
      include:
        - domain/named-policy-pattern.md

overlay:
  agents: [stacks/nestjs-ddd/]
  patterns: [domain/]
  rules: [nestjs-ddd/]
  hooks: [check-delegation, check-patterns-read, check-subagent-pattern-reads, check-approval-before-impl, check-ddd-patterns, check-domain-purity]

# Rozbrojenie kolizji z ECC (spike S3) + wymuszenie delegacji — przeniesione
# z presets/nestjs-ddd.yml (env należy do overlay'u DDD, nie do frameworka)
env:
  ECC_GATEGUARD: "off"
  ECC_DISABLED_HOOKS: "pre:edit-write:gateguard-fact-force,pre:bash:gateguard-fact-force"
  DELEGATION_MODE: "block"

analyze:
  panel:
    - { stage: ddd-modeling, agent: "ddd-application-expert" }
    - { stage: impl-analysis, agent: "infrastructure-implementer", advisory: true }
    - { stage: pattern-fit, agent: "code-quality-verifier", advisory: true }
  exit: PAUSE

# Warstwy implementacji, pętla verify i bramka końcowa: `blocks/ddd/layers.yml`
# (oś architektury). Przeniesione stąd 2026-08-12 — patrz nagłówek tamtego bloku.

# Routing plik → wzorzec dla hooków (check-patterns-read, check-delegation).
# Mieszka tu, a nie w hooks/lib/pattern-routing.js, bo to blok modelu domenowego
# wie, że agregat leży w `/domain/aggregates/` i rządzi nim aggregate-pattern.
# Generowane do hooks/lib/pattern-routing.generated.js — patrz
# scripts/generate-pattern-routing.mjs (`--check` pilnuje rozjazdu).
pattern_routing:
  paths:
    - { match: "/domain/aggregates/", pattern: domain/aggregate-pattern.md }
    - { match: "/domain/value-objects/", pattern: domain/value-object-pattern.md }
    - { match: "/domain/entities/", pattern: domain/entity-pattern.md }
    - { match: "/domain/events/", pattern: domain/domain-event-pattern.md }
    - { match: "/domain/services/", pattern: domain/domain-service-pattern.md }
    - { match: "/domain/specifications/", pattern: domain/specification-policy-pattern.md }
    - { match: "/domain/policies/", pattern: domain/specification-policy-pattern.md }
  filenames:
    - { match: "\\.aggregate\\.ts$", pattern: domain/aggregate-pattern.md }
    - { match: "\\.vo\\.ts$", pattern: domain/value-object-pattern.md }
    - { match: "\\.entity\\.ts$", pattern: domain/entity-pattern.md }
    - { match: "\\.event\\.ts$", pattern: domain/domain-event-pattern.md }
    - { match: "\\.specification\\.ts$", pattern: domain/specification-policy-pattern.md }
    - { match: "\\.policy\\.ts$", pattern: domain/specification-policy-pattern.md }
