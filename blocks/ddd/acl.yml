# Blok: ddd/acl — komunikacja między bounded contextami przez ACL Registry.
name: ddd/acl
# Oś architektury, ale NIE wnosi własnych warstw do orchestrate.layers —
# warstwy wnosi wyłącznie ddd/core. axis: architecture tu nie oznacza
# obowiązku deklarowania layers.
axis: architecture
requires: [ddd/core, ddd/events]

patterns:
  triggers:
    - keywords: [acl, cross-context, bounded context, another context]
      include:
        - architecture/acl-registry-pattern.md
        - architecture/cross-context-communication.md

# Routing plik → wzorzec (patrz ddd/core.yml po uzasadnienie miejsca).
pattern_routing:
  paths:
    - { match: "/infrastructure/acl/", pattern: architecture/acl-registry-pattern.md }
  filenames:
    - { match: "\\.adapter\\.ts$", pattern: architecture/acl-registry-pattern.md }
