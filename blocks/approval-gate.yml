# Blok: approval-gate — składalna TWARDA bramka approval dla projektów bez ddd/core.
# Wnosi to samo co ddd/core w wymiarze procesu: /analyze kończy się PAUSE
# (artefakt czeka na odpowiedzi + status: approved), /orchestrate odmawia
# startu bez zatwierdzonej analizy; hook egzekwuje to także fizycznie.
# Projekt, który świadomie NIE chce bramki, po prostu nie dodaje tego bloku.
name: approval-gate
axis: process
requires: []

overlay:
  # check-human-voice pilnuje drugiej połowy tej samej bramki: approval ma sens tylko
  # wtedy, gdy człowiek rozumie, co zatwierdza (`open_questions[].ask`, `decisions[].means`).
  hooks: [check-approval-before-impl, check-human-voice]

analyze:
  exit: PAUSE
