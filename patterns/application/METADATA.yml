# Application Layer Patterns — metadane katalogu.
# Schemat: jeden dla całego patterns/** (K84, TASK-KAIZEN-002). Walidator:
# node scripts/validate-metadata.mjs
category: application
version: "1.1.0"
maturity: production
last_verified: 2026-08-31
stack: "TypeScript, NestJS, @vytches/ddd"
source_projects: "LocalHero v3 (1355+ testów), juz-ide-api-1"
patterns_count: 5
description: >-
  Wzorce CQRS i orkiestracji aplikacyjnej: handlery komend/zapytań z
  auto-discovery przez dekoratory (v2.0, bez ręcznej rejestracji w providers),
  serwisy aplikacyjne dla przepływów wielokrokowych i saga, handlery audytu
  (ADR-0027, logowanie GDPR) oraz protokół TCC (reserve → confirm/release).

# Opcjonalne pola starego schematu, zachowane bo niosą informację:
layer: application
stack_support: [typescript]

